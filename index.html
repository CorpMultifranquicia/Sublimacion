<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubliApp · Zafiro Lab</title>
    <script src="vendor/tailwind.js"></script>
    <script>
        // Paleta "zafiro" tomada del logo de Zafiro Lab. Reemplaza al índigo de Tailwind en toda
        // la app: para cambiar el color principal basta con editar estos valores.
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        indigo: {
                            50: '#eef3ff', 100: '#dce6ff', 200: '#bccfff', 300: '#8daefc', 400: '#5b86f5',
                            500: '#3563e9', 600: '#2347c8', 700: '#1d37a3', 800: '#1b2f84', 900: '#1b2a66',
                        },
                    },
                },
            },
        };
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4 54 24 32 60 10 24Z' fill='%232347c8'/%3E%3Cpath d='M32 4 54 24H10Z' fill='%238b2fc9'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="vendor/inter/inter.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased h-screen overflow-hidden">

    <!-- PANTALLA DE CARGA -->
    <div id="loading-screen" class="h-screen w-full flex items-center justify-center bg-slate-50">
        <i class="fa-solid fa-gem text-4xl text-indigo-600 animate-pulse"></i>
    </div>

    <!-- ERROR DE CARGA -->
    <div id="error-screen" class="hidden h-screen w-full flex items-center justify-center bg-slate-50">
        <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl border border-slate-100/50 p-8 text-center">
            <h1 class="text-2xl font-bold text-indigo-600 tracking-tight mb-2"><i class="fa-solid fa-gem mr-2"></i>SubliApp</h1>
            <p class="text-sm text-slate-600 mb-2">No se pudo cargar la información.</p>
            <p id="error-detalle" class="text-xs text-rose-600 mb-6"></p>
            <button onclick="App.iniciar()" class="w-full py-3 bg-indigo-600 text-white rounded-lg font-bold shadow-md shadow-indigo-200 hover:bg-indigo-700 transition-colors">Reintentar</button>
        </div>
    </div>

    <!-- APP -->
    <div id="app-shell" class="hidden h-screen w-full flex relative">

        <!-- OVERLAY MÓVIL -->
        <div id="sidebar-overlay" onclick="App.toggleSidebar(false)" class="hidden fixed inset-0 bg-slate-900/40 z-20 md:hidden"></div>

        <!-- MENÚ LATERAL -->
        <aside id="sidebar" class="w-60 bg-white shadow-xl flex flex-col z-30 fixed md:relative inset-y-0 left-0 -translate-x-full md:translate-x-0 transition-transform duration-200 shrink-0">
            <div id="marca" class="h-20 flex items-center justify-center px-4 border-b border-slate-100 shrink-0"></div>
            <nav id="nav" class="flex-1 px-3 py-2 space-y-0.5 overflow-y-auto"></nav>
            <div class="p-4 border-t border-slate-100 shrink-0">
                <div class="flex items-center gap-3">
                    <div id="negocio-avatar" class="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-600 to-violet-600 flex items-center justify-center text-white text-sm font-bold shadow-md shrink-0"></div>
                    <div class="flex-1 min-w-0">
                        <p id="negocio-nombre" class="text-sm font-bold text-slate-700 truncate"></p>
                        <button onclick="App.showTab('configuracion')" class="text-xs text-slate-400 hover:text-indigo-600">Versión local · Configurar</button>
                    </div>
                </div>
            </div>
        </aside>

        <!-- ÁREA DE CONTENIDO -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden bg-slate-50/50 min-w-0">
            <header class="h-16 bg-white border-b border-slate-100 flex items-center justify-between px-4 sm:px-8 gap-3 shrink-0">
                <div class="flex items-center gap-3 min-w-0">
                    <button onclick="App.toggleSidebar()" class="md:hidden text-slate-500 hover:text-indigo-600 text-xl" aria-label="Menú"><i class="fa-solid fa-bars"></i></button>
                    <div class="min-w-0">
                        <h2 id="header-title" class="text-xl font-bold text-slate-800 truncate"></h2>
                        <p id="header-subtitle" class="text-xs text-slate-500 truncate"></p>
                    </div>
                </div>
                <div class="flex items-center gap-2 sm:gap-3 shrink-0" id="header-actions"></div>
            </header>
            <div id="contenido" class="flex-1 overflow-y-auto p-4 sm:p-8"></div>
        </main>
    </div>

    <!-- MODAL GENÉRICO -->
    <div id="modal-overlay" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div id="modal-panel"></div>
    </div>

    <script src="vendor/jspdf.umd.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
