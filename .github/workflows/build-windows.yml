# Compila SubliApp para Windows y deja el .zip listo para descargar
# en la pestaña "Actions" de GitHub (sección "Artifacts" de cada ejecución).
name: Compilar SubliApp para Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'SubliApp.py'
      - 'SubliApp.spec'
      - 'backend/**'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'vendor/**'
      - 'requirements.txt'
      - 'Borrar datos.bat'
      - 'LEEME.txt'
      - 'docs/**'
      - '.github/workflows/build-windows.yml'

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write   # para publicar la versión (Release) cuando se sube a main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compilar ejecutable
        run: pyinstaller --noconfirm SubliApp.spec

      - name: Agregar archivos de ayuda
        shell: pwsh
        run: |
          Copy-Item "Borrar datos.bat" dist/SubliApp/
          Copy-Item "LEEME.txt" dist/SubliApp/
          Copy-Item "docs/Instructivo_SubliApp.pdf" dist/SubliApp/

      - name: Probar que arranca
        shell: pwsh
        run: |
          $p = Start-Process dist/SubliApp/SubliApp.exe -ArgumentList '--sin-navegador' -PassThru
          Start-Sleep -Seconds 8
          $r = Invoke-RestMethod http://127.0.0.1:8765/api/ping
          Stop-Process -Id $p.Id -Force
          if ($r.app -ne 'SubliApp') { throw 'El ejecutable no respondió' }
          Remove-Item -Recurse -Force dist/SubliApp/SubliApp_datos

      - uses: actions/upload-artifact@v4
        with:
          name: SubliApp-windows
          path: dist/SubliApp
          retention-days: 90

      # En main: publica una versión descargable permanente (pestaña Releases).
      - name: Empaquetar .zip
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          # Seguridad: el paquete jamás debe traer datos, o pisaría los del negocio al actualizar.
          if (Test-Path dist/SubliApp/SubliApp_datos) { throw 'El paquete contiene SubliApp_datos: no se publica.' }
          Compress-Archive -Path dist/SubliApp -DestinationPath SubliApp-windows.zip

      - name: Publicar versión
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.${{ github.run_number }}
          name: SubliApp v2.${{ github.run_number }}
          make_latest: true
          body: |
            Descarga **SubliApp-windows.zip**, descomprímelo en `C:\SubliApp\` y abre `SubliApp.exe`.
            Si actualizas desde una versión anterior, reemplaza todo **excepto** la carpeta `SubliApp_datos`.
            El instructivo completo viene incluido (Instructivo_SubliApp.pdf) y también se adjunta aquí.
          files: |
            SubliApp-windows.zip
            docs/Instructivo_SubliApp.pdf
